[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "lmn516-wechat-sender"
version = "0.1.0"
description = "Minimal macOS WeChat sender without OCR"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "BurgCreate"}]
[project.scripts]
lmn-wechat-sender = "lmn_wechat_sender:main"
[tool.setuptools.packages.find]
include = ["lmn_wechat_sender*"]
